name: Publish package on tag

on:
  push:
    # Restrict to patch releases for v1.x (safety)
    tags:
      - 'v1.0.*'
  # Allow manual runs (useful for dry-run)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, build only and skip publish'
        required: false
        default: 'false'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-react-app
    # Use input or default env to control dry-run
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: |
          echo "DRY_RUN=${DRY_RUN}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN enabled — skipping publish"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then echo "NPM_TOKEN is not set; aborting"; exit 1; fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
